services:
  mysql:
    image: mysql:8.0
    # 实例/Docker 重启后自动拉起（除非曾手动 docker compose stop）
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    # 不映射主机端口：后端通过服务名 mysql:3306 访问；避免与主机已有 MySQL/3306 冲突
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    restart: unless-stopped
    build: ./backend
    volumes:
      # 持久化离线净值库与 K 线索引，避免容器重建后从空库重新灌数据
      - backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      BAIDU_OCR_APP_ID: ${BAIDU_OCR_APP_ID}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      HOT_STARTUP_DELAY_SEC: 120
      FUND_SNAPSHOT_REFRESH_INTERVAL_SEC: 86400
      FUND_SNAPSHOT_INITIAL_LOOKBACK_DAYS: 30
      FUND_SNAPSHOT_COMMIT_EVERY: 50
      FUND_SNAPSHOT_STARTUP_DELAY_SEC: 1800
      FUND_SNAPSHOT_DAILY_MAX_CODES: 100
      FUND_OFFLINE_SYNC_INTERVAL_SEC: 86400
      FUND_OFFLINE_INITIAL_LOOKBACK_DAYS: 30
      FUND_OFFLINE_SYNC_STARTUP_DELAY_SEC: 1800
      FUND_OFFLINE_SYNC_ROUND_BUDGET_SEC: 120
      FUND_OFFLINE_REBUILD_INDEX_ON_SCHEDULER: "false"
      FUND_OFFLINE_SYNC_MAX_CODES: 200
    ports:
      - "8000:8000"

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        # 小内存 VPS 勿超过物理内存一半；需要时在主机 .env 设 FRONTEND_NODE_MEMORY_MB=1536
        NODE_MEMORY_MB: ${FRONTEND_NODE_MEMORY_MB:-1024}
    # 主机 80 常被系统 Nginx/其它站占用；8080 若给其它项目，FINANO 用 8081 → 访问 http://IP:8081/
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_data:
