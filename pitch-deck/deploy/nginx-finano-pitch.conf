# Sample Nginx site for FINANO pitch deck on port 8082
# Copy to server, e.g. /etc/nginx/sites-available/finano-pitch
# then: sudo ln -s .../finano-pitch /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    root /var/www/finano-pitch-ppt;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(mp4|mp3|png|jpg|jpeg|gif|webp|css|js|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
