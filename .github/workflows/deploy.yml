name: Auto Deploy FINANO

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # 前端在 GitHub 机器上构建，避免 VPS 跑 vite 时内存打满、SSH 掉线、Actions 超时
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend dist
        working-directory: frontend
        run: npm ci && npm run build

      - name: Pack frontend dist
        run: tar czf frontend-dist.tgz -C frontend dist

      - name: Upload dist tarball to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "frontend-dist.tgz"
          target: "/opt/finano/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 3m
          command_timeout: 45m
          script: |
            cd /opt/finano
            git fetch origin main
            git reset --hard origin/main
            if command -v git-lfs >/dev/null 2>&1; then
              git lfs pull
            fi
            bash scripts/vps-deploy.sh
            if [ -d pitch-deck ]; then
              mkdir -p /var/www/finano-pitch-ppt
              rsync -a --delete pitch-deck/ /var/www/finano-pitch-ppt/
              echo "Pitch deck synced → http://$(hostname -I | awk '{print $1}'):8082/"
            fi
