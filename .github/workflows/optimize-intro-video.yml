# Re-encode intro MP4 on VPS. Split steps + long timeout — apt install ffmpeg can exceed 20m on small instances.
name: Optimize intro video (VPS)

on:
  workflow_dispatch:

jobs:
  optimize-on-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Sync repo + Git LFS on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 120s
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/finano
            git fetch origin main
            git reset --hard origin/main
            command -v git-lfs >/dev/null 2>&1 && git lfs pull || true
            ls -lh pitch-deck/assets/finano_concept.mp4

      - name: Install ffmpeg if missing (skip when already installed)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 120s
          command_timeout: 45m
          script: |
            set -euo pipefail
            if command -v ffmpeg >/dev/null 2>&1; then
              echo "ffmpeg already installed: $(ffmpeg -version | head -1)"
              exit 0
            fi
            export DEBIAN_FRONTEND=noninteractive
            export NEEDRESTART_MODE=a
            sudo -E apt-get update -qq
            sudo -E apt-get install -y --no-install-recommends \
              -o Dpkg::Options::="--force-confdef" \
              -o Dpkg::Options::="--force-confold" \
              ffmpeg
            ffmpeg -version | head -1

      - name: Re-encode + sync to :8082
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/finano
            chmod +x scripts/optimize-intro-video.sh scripts/sync-pitch-deck.sh
            bash scripts/optimize-intro-video.sh
            bash scripts/sync-pitch-deck.sh
            echo "========== sizes =========="
            ls -lh pitch-deck/assets/finano_concept.mp4 pitch-deck/assets/finano_concept.source.mp4 2>/dev/null || true
            ls -lh /var/www/finano-pitch-ppt/assets/finano_concept.mp4
            curl -sS -o /dev/null -w "HTTP %{http_code}, bytes=%{size_download}\n" http://127.0.0.1:8082/assets/finano_concept.mp4
